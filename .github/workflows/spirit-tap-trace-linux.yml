name: Spirit Tap Trace Linux

on:
  push:
    branches:
      - debug/spirit-tap-trace
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 libace-dev libmariadb-dev libssl-dev zlib1g-dev zip

      - name: Apply trace instrumentation
        run: python3 ./debug/spirit-tap-trace/patch_trace.py

      - name: Configure
        run: |
          cmake -S . -B build-spirit-tap-trace \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_STD_MALLOC=ON \
            -DUSE_SCRIPTS=ON \
            -DUSE_EXTRACTORS=OFF \
            -DUSE_DISCORD_BOT=OFF \
            -DUSE_LIBCURL=OFF

      - name: Build mangosd and realmd
        run: cmake --build build-spirit-tap-trace --target mangosd realmd --parallel 2

      - name: Collect binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trace-linux
          MANGOSD="$(find build-spirit-tap-trace -type f -name mangosd -perm -111 | head -n1)"
          REALMD="$(find build-spirit-tap-trace -type f -name realmd -perm -111 | head -n1)"
          test -n "$MANGOSD"
          test -n "$REALMD"
          cp "$MANGOSD" trace-linux/mangosd
          cp "$REALMD" trace-linux/realmd
          chmod +x trace-linux/mangosd trace-linux/realmd
          ldd trace-linux/mangosd | tee trace-linux/ldd-mangosd.txt
          ldd trace-linux/realmd | tee trace-linux/ldd-realmd.txt
          git rev-parse HEAD > trace-linux/SOURCE_COMMIT.txt

      - name: Check binaries against stable runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/mserajnik/tortoise-server:stable
          docker run --rm \
            -v "$PWD/trace-linux:/trace:ro" \
            --entrypoint /bin/sh \
            ghcr.io/mserajnik/tortoise-server:stable \
            -c 'ldd /trace/mangosd && ldd /trace/realmd'

      - name: Package isolated trace server kit
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PWD/Turtle-WoW-SpiritTap-TRACE-kit"
          mkdir -p "$PKG/trace-bin"
          cp trace-linux/mangosd "$PKG/trace-bin/mangosd"
          cp trace-linux/realmd "$PKG/trace-bin/realmd"
          cp trace-linux/ldd-mangosd.txt "$PKG/trace-bin/"
          cp trace-linux/ldd-realmd.txt "$PKG/trace-bin/"
          cp trace-linux/SOURCE_COMMIT.txt "$PKG/trace-bin/"
          cp debug/spirit-tap-trace/deploy/* "$PKG/"
          printf '%s\n' \
            'Turtle WoW 1.18.1 - Spirit Tap / Touch of Weakness TRACE kit' \
            '' \
            '1. Stop the primary server normally.' \
            '2. Run 00_СОЗДАТЬ_TRACE_СЕРВЕР.cmd.' \
            '3. The installer creates G:\servers\Tortoise-WoW-1.18.1-SpiritTap-TRACE.' \
            '4. Run 02_ЗАПУСТИТЬ_TRACE.cmd in that new folder.' \
            '5. Reproduce the bug once.' \
            '6. Run 09_СМОТРЕТЬ_TRACE_ЛОГ.cmd and copy the trace lines.' \
            '' \
            'No SQL is applied. The trace database is an unchanged clone of the primary volume.' \
            'The primary database volume is mounted read-only only during the one-time clone.' \
            'Extracted map data is shared through a directory junction to avoid duplicating many GB.' \
            > "$PKG/README_FIRST.txt"
          chmod +x "$PKG/trace-bin/mangosd" "$PKG/trace-bin/realmd"
          zip -r Turtle-WoW-SpiritTap-TRACE-kit.zip Turtle-WoW-SpiritTap-TRACE-kit

      - name: Upload trace server kit
        uses: actions/upload-artifact@v4
        with:
          name: Turtle-WoW-SpiritTap-TRACE-kit
          path: Turtle-WoW-SpiritTap-TRACE-kit.zip
          if-no-files-found: error
          retention-days: 7
