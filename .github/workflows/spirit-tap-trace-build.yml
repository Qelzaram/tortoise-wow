name: Spirit Tap Trace Win64

on:
  push:
    branches:
      - debug/spirit-tap-trace
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build trace server
        shell: pwsh
        run: .\debug\spirit-tap-trace\build_windows.ps1

      - name: Upload trace binaries
        uses: actions/upload-artifact@v4
        with:
          name: turtle-wow-spirit-tap-trace-win64
          path: trace-artifact\*
          if-no-files-found: error
          retention-days: 7
